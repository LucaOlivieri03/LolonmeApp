<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 0 400 400" width="400" height="400">
  <defs>
    <!-- Sector base de 36° (con leve margen) centrado arriba -->
    <clipPath id="sector">
      <path d="M 247.67 33.01 A 175 175 0 0 1 352.33 33.01 L 337.38 80.72 A 125 125 0 0 0 262.62 80.72 Z" />
    </clipPath>
    <!-- Clip para la pelota central -->
    <clipPath id="ball-clip">
      <circle cx="300" cy="200" r="120" />
    </clipPath>
  </defs>

  <!-- ANILLO DE BANDERAS -->
  <g id="flags">
    <!-- 1. Bolivia (18°) -->
    <g transform="rotate(18, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="166.7" fill="none" stroke="#D52B1E" stroke-width="17.5" />
      <circle cx="300" cy="200" r="150" fill="none" stroke="#F9E300" stroke-width="17.5" />
      <circle cx="300" cy="200" r="133.3" fill="none" stroke="#007934" stroke-width="17.5" />
      <ellipse cx="300" cy="50" rx="8" ry="6" fill="#D52B1E" stroke="#007934" stroke-width="1.5" />
      <circle cx="300" cy="50" r="3" fill="#F9E300" />
    </g>

    <!-- 2. Brasil (54°) -->
    <g transform="rotate(54, 300, 200)" clip-path="url(#sector)">
      <rect x="230" y="20" width="140" height="80" fill="#009C3B" />
      <polygon points="300,31 334,51 300,71 266,51" fill="#FFDF00" />
      <circle cx="300" cy="51" r="12" fill="#002776" />
      <path d="M 289 48 Q 300 54 311 50" fill="none" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- 3. Colombia (90°) -->
    <g transform="rotate(90, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="137.5" fill="none" stroke="#FCD116" stroke-width="26" />
      <circle cx="300" cy="200" r="156.25" fill="none" stroke="#003893" stroke-width="13.5" />
      <circle cx="300" cy="200" r="168.75" fill="none" stroke="#CE1126" stroke-width="13.5" />
    </g>

    <!-- 4. Chile (126°) -->
    <g transform="rotate(126, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="137.5" fill="none" stroke="#FFFFFF" stroke-width="26" />
      <circle cx="300" cy="200" r="162.5" fill="none" stroke="#D52B1E" stroke-width="26" />
      <rect x="255" y="50" width="32" height="32" fill="#0039A6" />
      <polygon points="274,56 276,62 282,62 277,65 279,71 274,67 269,71 271,65 266,62 272,62" fill="#FFFFFF" />
    </g>

    <!-- 5. Ecuador (162°) -->
    <g transform="rotate(162, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="137.5" fill="none" stroke="#FFDD00" stroke-width="26" />
      <circle cx="300" cy="200" r="156.25" fill="none" stroke="#034EA2" stroke-width="13.5" />
      <circle cx="300" cy="200" r="168.75" fill="none" stroke="#ED1C24" stroke-width="13.5" />
      <ellipse cx="300" cy="52" rx="6" ry="8" fill="#8B5A2B" stroke="#FCD116" stroke-width="1.2" />
      <circle cx="300" cy="52" r="3" fill="#034EA2" />
    </g>

    <!-- 6. Paraguay (198°) -->
    <g transform="rotate(198, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="133.3" fill="none" stroke="#D52B1E" stroke-width="17.5" />
      <circle cx="300" cy="200" r="150" fill="none" stroke="#FFFFFF" stroke-width="17.5" />
      <circle cx="300" cy="200" r="166.7" fill="none" stroke="#0038A8" stroke-width="17.5" />
      <circle cx="300" cy="50" r="6" fill="none" stroke="#0038A8" stroke-width="1.2" />
      <circle cx="300" cy="50" r="2.5" fill="#F9E300" />
    </g>

    <!-- 7. Perú (234°) -->
    <g transform="rotate(234, 300, 200)" clip-path="url(#sector)">
      <rect x="240" y="20" width="42" height="80" fill="#D91023" />
      <rect x="282" y="20" width="36" height="80" fill="#FFFFFF" />
      <rect x="318" y="20" width="42" height="80" fill="#D91023" />
      <ellipse cx="300" cy="52" rx="6" ry="7" fill="#007934" />
      <circle cx="300" cy="52" r="3.5" fill="#D91023" />
    </g>

    <!-- 8. Uruguay (270°) -->
    <g transform="rotate(270, 300, 200)" clip-path="url(#sector)">
      <rect x="240" y="20" width="120" height="80" fill="#FFFFFF" />
      <circle cx="300" cy="200" r="169" fill="none" stroke="#0038A8" stroke-width="5.5" />
      <circle cx="300" cy="200" r="156.5" fill="none" stroke="#0038A8" stroke-width="5.5" />
      <circle cx="300" cy="200" r="144" fill="none" stroke="#0038A8" stroke-width="5.5" />
      <circle cx="300" cy="200" r="131.5" fill="none" stroke="#0038A8" stroke-width="5.5" />
      <rect x="308" y="50" width="40" height="32" fill="#FFFFFF" />
      <circle cx="323" cy="64" r="6.5" fill="#FCD116" stroke="#B8860B" stroke-width="1" />
    </g>

    <!-- 9. Venezuela (306°) -->
    <g transform="rotate(306, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="166.7" fill="none" stroke="#FFCC00" stroke-width="17.5" />
      <circle cx="300" cy="200" r="150" fill="none" stroke="#00247D" stroke-width="17.5" />
      <circle cx="300" cy="200" r="133.3" fill="none" stroke="#CF142B" stroke-width="17.5" />
      <g fill="#FFFFFF">
        <circle cx="285" cy="52" r="1.4" />
        <circle cx="290" cy="48.5" r="1.4" />
        <circle cx="296" cy="46.5" r="1.4" />
        <circle cx="303" cy="46.5" r="1.4" />
        <circle cx="309" cy="48.5" r="1.4" />
        <circle cx="314" cy="52" r="1.4" />
      </g>
    </g>

    <!-- 10. Argentina (342°) -->
    <g transform="rotate(342, 300, 200)" clip-path="url(#sector)">
      <circle cx="300" cy="200" r="166.7" fill="none" stroke="#74ACDF" stroke-width="17.5" />
      <circle cx="300" cy="200" r="150" fill="none" stroke="#FFFFFF" stroke-width="17.5" />
      <circle cx="300" cy="200" r="133.3" fill="none" stroke="#74ACDF" stroke-width="17.5" />
      <circle cx="300" cy="50" r="6" fill="#F6B40E" />
    </g>
  </g>

  <!-- PELOTA CENTRAL -->
  <g id="ball" clip-path="url(#ball-clip)">
    <circle cx="300" cy="200" r="120" fill="#E68E23" />
    <!-- Costuras blancas -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2.5">
      <polygon points="300,122 355,145 378,200 355,255 300,278 245,255 222,200 245,145" />
      <line x1="300" y1="122" x2="300" y2="80" />
      <line x1="355" y1="145" x2="395" y2="105" />
      <line x1="378" y1="200" x2="420" y2="200" />
      <line x1="355" y1="255" x2="395" y2="295" />
      <line x1="300" y1="278" x2="300" y2="320" />
      <line x1="245" y1="255" x2="205" y2="295" />
      <line x1="222" y1="200" x2="180" y2="200" />
      <line x1="245" y1="145" x2="205" y2="105" />
    </g>
  </g>

  <!-- MAPA DE SUDAMÉRICA -->
  <path id="south-america" fill="#008A38" d="M 278,116
       L 288,114 L 296,118 L 304,117 L 311,123 L 318,125 L 322,132
       L 328,137 L 339,144 L 352,150 L 360,159 L 357,171 L 348,184
       L 346,195 L 336,208 L 325,217 L 319,226 L 310,235 L 302,243
       L 297,255 L 290,264 L 288,274 L 283,281 L 287,288 L 281,291
       L 275,284 L 273,271 L 272,254 L 271,236 L 269,218 L 266,204
       L 259,192 L 252,180 L 247,168 L 246,156 L 251,148 L 250,139
       L 257,132 L 263,122 L 271,118 Z" />

  <!-- TEXTO CENTRAL -->
  <text x="300" y="214" text-anchor="middle" font-family="Arial Black, Impact, Helvetica, sans-serif" font-weight="900" font-size="42" letter-spacing="1.5" fill="#000000">C. R. F. 5</text>
</svg>